<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pruebas — LUQUE!</title>
<style>
  body{ font-family:ui-monospace,Consolas,monospace; background:#0a0a0a; color:#ddd; padding:2rem; line-height:1.7; }
  h1{ color:#FFFF00; font-size:16px; }
  h2{ color:#FFFF00; font-size:13px; margin:1.6rem 0 .4rem; }
  .ok{ color:#7CFC00; }
  .fallo{ color:#FF5555; }
  p{ margin-top:1.6rem; font-weight:bold; }
</style>
</head>
<body>
<h1>Pruebas — LUQUE!</h1>
<div id="salida"></div>

<script src="arnes.js"></script>
<script src="arnes-dom.js"></script>
<script src="../js/reglas-contenido.js"></script>
<script src="../js/datos.js"></script>
<script src="../js/contenido.js"></script>
<script src="../js/router.js"></script>
<script src="../js/composicion.js"></script>
<script src="../js/visor-estado.js"></script>
<!-- visor-carga.js no toca el DOM al cargarse: sólo define window.VisorCarga.
     Se carga por pintar(), que sí construye la <img> de la escena; el arnés de
     DOM le da su contenedor. Ver pruebas-visor-carga.js. -->
<script src="../js/visor-carga.js"></script>
<!-- Sólo por remedir(): su guarda no toca GaleriaPaneo, GaleriaTeclado ni
     Composicion.disponer, así que no hace falta cargar el resto del
     escenario espacial para probarla. Ver pruebas-galeria.js. -->
<script src="../js/galeria.js"></script>
<script src="../js/movil-recorrido.js"></script>
<script src="../js/movil-gestos.js"></script>
<script src="../js/movil-zoom.js"></script>
<script src="../js/movil-arrastre.js"></script>
<script src="../js/movil.js"></script>
<script src="../js/movil-hoja.js"></script>
<!-- Va ANTES de movil-visor.js, que desde la ronda de arreglos de la revisión
     final del bloque 4f usa `window.VisorFoco.atrapar` para el envolvente de
     foco del diálogo móvil, con el mismo orden relativo que ya usa
     index.html. Sin esta línea `window.VisorFoco` es undefined y el Tab
     dentro del visor abierto lanza un TypeError. Ver
     pruebas-movil-visor.js, sección «el foco del diálogo». -->
<script src="../js/visor-foco.js"></script>
<!-- Va ANTES de movil-visor.js, que lo usa en `pintar()` para construir la
     ficha técnica. movil-ficha.js no toca el DOM al cargarse: sólo define
     window.MovilFicha; sus pruebas van en pruebas-movil-ficha.js. -->
<script src="../js/movil-ficha.js"></script>
<!-- Va ANTES de movil-visor.js, que lo usa en `pintar()` para animar la
     entrada de la pieza nueva. movil-animacion.js no toca el DOM al cargarse:
     sólo define window.MovilAnimacion; sus pruebas van en
     pruebas-movil-animacion.js. -->
<script src="../js/movil-animacion.js"></script>
<script src="../js/movil-tira.js"></script>
<!-- movil-visor.js no toca el DOM al cargarse: sólo define window.MovilVisor.
     `ordenDe` es pura y se prueba sola; lo que sí construye nodos —`aplicar`,
     que pinta la escena— recibe su contenedor del arnés de DOM.
     Ver pruebas-movil-visor.js. -->
<script src="../js/movil-visor.js"></script>
<!-- movil-hud.js no toca el DOM al cargarse: sólo define window.MovilHud.
     `contador` y `OCULTAR_TRAS` se prueban solos; `pintar` e `init`, que sí
     construyen nodos, reciben sus elementos del arnés de DOM.
     Ver pruebas-movil-hud.js. -->
<script src="../js/movil-hud.js"></script>
<script src="../js/movil-puerta.js"></script>
<script src="../js/hero.js"></script>
<script src="../js/plataforma.js"></script>
<!-- Lo llaman visor-ficha.js y movil-ficha.js al pintar las filas de la
     ficha. Aquí el orden relativo NO importa y en index.html SÍ: ninguno
     de los tres toca a los otros al cargarse -sólo definen su window.*-,
     así que basta con que los tres estén antes de que alguien pinte.
     Que index.html lo cargue antes que sus dos consumidores lo comprueba
     pruebas-ficha-dato.js sobre la página real, no sobre este arnés. -->
<script src="../js/ficha-dato.js"></script>
<!-- visor-rueda.js es puro: sólo define window.VisorRueda. Lo usa visor.js
     al rodar, que aquí sólo carga pruebas-visor-foco.js en su iframe.
     Ver pruebas-visor-rueda.js. -->
<script src="../js/visor-rueda.js"></script>
<!-- Va DESPUÉS de plataforma.js, que `pintar` usa para construir el botón del
     vídeo, con el mismo orden relativo que ya usa index.html. visor-ficha.js
     no toca el DOM al cargarse: sólo define window.VisorFicha; `init` y
     `pintar`, que sí lo tocan, reciben su marcado del arnés de DOM.
     Ver pruebas-visor-ficha.js. -->
<script src="../js/visor-ficha.js"></script>
<script src="../panel/js/identificador.js"></script>
<script src="../panel/js/orden.js"></script>
<!-- rutas.js es puro: sólo define window.Rutas. Lee el fragmento y dice qué
     pantalla del panel toca. No se confunde con js/router.js, que enruta la
     web pública. Ver pruebas-rutas-panel.js. -->
<script src="../panel/js/rutas.js"></script>
<!-- edicion.js es puro: sólo define window.Edicion. Va DESPUÉS de orden.js,
     que usa para mover piezas. Ver pruebas-edicion.js. -->
<script src="../panel/js/edicion.js"></script>
<!-- imagenes.js no toca el DOM al cargarse: sólo define window.Imagenes.
     `caber` y `MEDIDAS` se prueban solas; `reducir`, que sí construye un
     canvas, se ejercita con un PNG en un data: URI. Ver pruebas-imagenes.js. -->
<script src="../panel/js/imagenes.js"></script>
<!-- subida.js se carga aquí sólo por sus dos piezas sin red, `nombre` y
     `sello`. `subir`, que sí habla con el Worker, se ejercita dentro de un
     iframe con fetch doblado — de ahí que pruebas-subida.js vuelva a
     cargarlo allí. Ver pruebas-subida.js. -->
<script src="../panel/js/subida.js"></script>
<!-- lista.js no toca el DOM al cargarse: sólo define window.Lista. Se carga
     por sus tres funciones sin DOM (indiceValido, calcularHasta,
     dentroDeLaCaja) y también por `pintar`, que sí construye nodos: el arnés
     de DOM le da un <ol> propio, así que no hace falta el panel entero. -->
<script src="../panel/js/lista.js"></script>
<!-- fotos.js no toca el DOM al cargarse: sólo define window.Fotos. Va DESPUÉS
     de lista.js y edicion.js, que usa: la aritmética del arrastre se reutiliza
     de lista.js en vez de escribirla dos veces. Ver pruebas-fotos.js. -->
<script src="../panel/js/fotos.js"></script>
<!-- proyecto.js no toca el DOM al cargarse: sólo define window.Proyecto. Va
     DESPUÉS de fotos.js, edicion.js y lista.js (de donde saca ETIQUETAS), que
     usa al pintar. Ver pruebas-proyecto.js. -->
<script src="../panel/js/proyecto.js"></script>
<!-- subir.js es el pegamento entre Subida y Edicion, y el aviso de lo que
     entro y lo que no. Se carga por `contar`, que es pura. -->
<script src="../panel/js/subir.js"></script>
<!-- pantallas.js es puro: sólo define window.Pantallas. -->
<script src="../panel/js/pantallas.js"></script>
<!-- cambios.js es puro: sólo define window.Cambios. Compara el borrador con
     lo publicado y dice qué cambiaría. Ver pruebas-cambios.js. -->
<script src="../panel/js/cambios.js"></script>
<!-- pantalla-publicar.js no toca el DOM al cargarse: sólo define
     window.PantallaPublicar. Sólo pinta —la red es de publicacion.js—, así que
     se prueba entera sin doblar nada. Ver pruebas-pantalla-publicar.js. -->
<script src="../panel/js/pantalla-publicar.js"></script>
<!-- nuevo.js (el formulario de crear, salido de panel.js en el 3d) y
     publicar.js (el estado de la pantalla de publicar). Los dos se ejercitan
     desde fuera, a través del panel, en pruebas-panel.js. -->
<script src="../panel/js/nuevo.js"></script>
<script src="../panel/js/publicar.js"></script>
<script src="pruebas-arnes.js"></script>
<script src="pruebas-arnes-dom.js"></script>
<script src="pruebas-datos.js"></script>
<script src="pruebas-contenido.js"></script>
<script src="pruebas-plataforma.js"></script>
<script src="pruebas-ficha-dato.js"></script>
<script src="pruebas-router.js"></script>
<script src="pruebas-router-ir.js"></script>
<script src="pruebas-composicion.js"></script>
<script src="pruebas-visor-estado.js"></script>
<script src="pruebas-visor-carga.js"></script>
<script src="pruebas-visor-ficha.js"></script>
<script src="pruebas-visor-lupa.js"></script>
<script src="pruebas-visor-rueda.js"></script>
<script src="pruebas-galeria.js"></script>
<script src="pruebas-movil-recorrido.js"></script>
<script src="pruebas-movil-gestos.js"></script>
<script src="pruebas-movil-zoom.js"></script>
<script src="pruebas-movil-arrastre.js"></script>
<script src="pruebas-movil.js"></script>
<script src="pruebas-movil-hoja-rejilla.js"></script>
<script src="pruebas-movil-hoja-filtrar.js"></script>
<script src="pruebas-movil-ficha.js"></script>
<script src="pruebas-movil-animacion.js"></script>
<script src="pruebas-movil-tira.js"></script>
<script src="pruebas-movil-visor.js"></script>
<script src="pruebas-movil-visor-zoom.js"></script>
<script src="pruebas-movil-hud.js"></script>
<script src="pruebas-movil-puerta.js"></script>
<script src="pruebas-movil-puerta-async.js"></script>
<script src="pruebas-hero.js"></script>
<script src="pruebas-identificador.js"></script>
<script src="pruebas-orden.js"></script>
<script src="pruebas-rutas-panel.js"></script>
<script src="pruebas-edicion.js"></script>
<script src="pruebas-imagenes.js"></script>
<script src="pruebas-subida.js"></script>
<script src="pruebas-lista.js"></script>
<script src="pruebas-lista-pintar.js"></script>
<script src="pruebas-fotos.js"></script>
<script src="pruebas-proyecto.js"></script>
<script src="pruebas-cambios.js"></script>
<script src="pruebas-publicacion.js"></script>
<script src="pruebas-pantalla-publicar.js"></script>
<!-- pruebas-panel.js carga panel/js/panel.js entero dentro de un iframe, con
     cuatro dependencias delante (reglas-contenido, identificador, orden,
     lista): cinco scripts encadenados por conDocumento. Que UN script se
     cargue y ejecute dentro del iframe bajo file:// está comprobado (ver
     pruebas-arnes-dom.js); que la CADENA de panel.js haga lo mismo entera no
     se ha podido comprobar con las herramientas de esta tarea — no es un
     fallo conocido, es una comprobación pendiente. Si al abrir esto con
     doble clic la sección "panel.js" no pinta nada, es la primera sospechosa. -->
<script src="pruebas-panel.js"></script>
<!-- Carga js/visor.js entero en un iframe, con el marcado del #visor sacado de
     index.html en vivo y css/luque.css de verdad: el defecto que cubre —el
     envolvente de foco del diálogo a anchura de móvil— no está en el JS solo ni
     en el CSS solo, sino en el encuentro de los dos. Necesita servidor, igual
     que la sección de abajo. -->
<script src="pruebas-visor-foco.js"></script>
<script src="pruebas-contenido-real.js"></script>
<script>window.Arnes.resumen();</script>
</body>
</html>
