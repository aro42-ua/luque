<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pruebas — LUQUE!</title>
<style>
  body{ font-family:ui-monospace,Consolas,monospace; background:#0a0a0a; color:#ddd; padding:2rem; line-height:1.7; }
  h1{ color:#FFFF00; font-size:16px; }
  h2{ color:#FFFF00; font-size:13px; margin:1.6rem 0 .4rem; }
  .ok{ color:#7CFC00; }
  .fallo{ color:#FF5555; }
  p{ margin-top:1.6rem; font-weight:bold; }
</style>
</head>
<body>
<h1>Pruebas — LUQUE!</h1>
<div id="salida"></div>

<script src="arnes.js"></script>
<script src="arnes-dom.js"></script>
<script src="../js/reglas-contenido.js"></script>
<script src="../js/datos.js"></script>
<script src="../js/contenido.js"></script>
<script src="../js/router.js"></script>
<script src="../js/composicion.js"></script>
<script src="../js/visor-estado.js"></script>
<script src="../js/movil-recorrido.js"></script>
<script src="../js/movil-gestos.js"></script>
<script src="../js/brillo.js"></script>
<script src="../js/hero.js"></script>
<script src="../panel/js/identificador.js"></script>
<script src="../panel/js/orden.js"></script>
<!-- lista.js no toca el DOM al cargarse: sólo define window.Lista. Se carga
     por sus tres funciones sin DOM (indiceValido, calcularHasta,
     dentroDeLaCaja) y también por `pintar`, que sí construye nodos: el arnés
     de DOM le da un <ol> propio, así que no hace falta el panel entero. -->
<script src="../panel/js/lista.js"></script>
<script src="pruebas-arnes.js"></script>
<script src="pruebas-arnes-dom.js"></script>
<script src="pruebas-datos.js"></script>
<script src="pruebas-contenido.js"></script>
<script src="pruebas-router.js"></script>
<script src="pruebas-router-ir.js"></script>
<script src="pruebas-composicion.js"></script>
<script src="pruebas-visor-estado.js"></script>
<script src="pruebas-movil-recorrido.js"></script>
<script src="pruebas-movil-gestos.js"></script>
<script src="pruebas-brillo.js"></script>
<script src="pruebas-hero.js"></script>
<script src="pruebas-identificador.js"></script>
<script src="pruebas-orden.js"></script>
<script src="pruebas-lista.js"></script>
<script src="pruebas-lista-pintar.js"></script>
<!-- pruebas-panel.js carga panel/js/panel.js entero dentro de un iframe, con
     cuatro dependencias delante (reglas-contenido, identificador, orden,
     lista): cinco scripts encadenados por conDocumento. Que UN script se
     cargue y ejecute dentro del iframe bajo file:// está comprobado (ver
     pruebas-arnes-dom.js); que la CADENA de panel.js haga lo mismo entera no
     se ha podido comprobar con las herramientas de esta tarea — no es un
     fallo conocido, es una comprobación pendiente. Si al abrir esto con
     doble clic la sección "panel.js" no pinta nada, es la primera sospechosa. -->
<script src="pruebas-panel.js"></script>
<script src="pruebas-contenido-real.js"></script>
<script>window.Arnes.resumen();</script>
</body>
</html>
